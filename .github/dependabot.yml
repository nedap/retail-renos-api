version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/java"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    groups:
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]
    ignore:
      # Majors need code changes; security updates are not affected by this rule.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Internal Nedap artifacts live in private GitHub Packages and are bumped by hand.
      - dependency-name: "com.nedap.*"
      - dependency-name: "com.nedap:*"
      # From 2.11 the PolymorphicTypeAdapterFactory in renos-api-message 1.2 fails to parse messages.
      # Unlike update-types, this also holds back security updates: a gson fix only in 2.11+ needs a new renos-json.
      - dependency-name: "com.google.code.gson:gson"
        versions: [">= 2.11"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Amsterdam"
    # Give a freshly published (potentially poisoned) tag time to be caught before we adopt it.
    cooldown:
      default-days: 4
    groups:
      github-actions-all:
        patterns: ["*"]
        update-types: ["minor", "patch"]
